services:
  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      PORT: '3000'
      MONGO_URL: mongodb://mongo:27017/lytex
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
      LYTEX_CLIENT_ID: ${LYTEX_CLIENT_ID}
      LYTEX_CLIENT_SECRET: ${LYTEX_CLIENT_SECRET}
      LYTEX_API_BASE: ${LYTEX_API_BASE:-https://sandbox-api-pay.lytex.com.br/v2}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      LOG_TO_DB: ${LOG_TO_DB:-true}
    depends_on:
      - mongo

volumes:
  mongo_data:
