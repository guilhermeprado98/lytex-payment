services:
  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      PORT: '3000'
      MONGO_URL: mongodb://mongo:27017/lytex
      JWT_SECRET: ${JWT_SECRET:-6f4c9a9e0a9b4f6db0c2e8d71a5f9b3c8e1d4a7f2b6c9e0d5f8a1b3c7e9d2f4}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
      LYTEX_CLIENT_ID: ${LYTEX_CLIENT_ID}
      LYTEX_CLIENT_SECRET: ${LYTEX_CLIENT_SECRET}
      LYTEX_API_BASE: ${LYTEX_API_BASE:-https://sandbox-api-pay.lytex.com.br/v2}
      LYTEX_INVOICE_CLIENT_CPF_CNPJ: ${LYTEX_INVOICE_CLIENT_CPF_CNPJ:-}
      LYTEX_INVOICE_CLIENT_NAME: ${LYTEX_INVOICE_CLIENT_NAME:-Pagador Sandbox}
      LYTEX_INVOICE_CLIENT_EMAIL: ${LYTEX_INVOICE_CLIENT_EMAIL:-pagador@exemplo.com}
      LYTEX_INVOICE_CLIENT_CELLPHONE: ${LYTEX_INVOICE_CLIENT_CELLPHONE:-11999999999}
      LYTEX_INVOICE_CLIENT_TREATMENT_PRONOUN: ${LYTEX_INVOICE_CLIENT_TREATMENT_PRONOUN:-you}
      LYTEX_INVOICE_CLIENT_ZIP: ${LYTEX_INVOICE_CLIENT_ZIP:-01310100}
      LYTEX_INVOICE_CLIENT_CITY: ${LYTEX_INVOICE_CLIENT_CITY:-São Paulo}
      LYTEX_INVOICE_CLIENT_STREET: ${LYTEX_INVOICE_CLIENT_STREET:-Rua Exemplo}
      LYTEX_INVOICE_CLIENT_STATE: ${LYTEX_INVOICE_CLIENT_STATE:-SP}
      LYTEX_INVOICE_CLIENT_ZONE: ${LYTEX_INVOICE_CLIENT_ZONE:-Centro}
      LYTEX_INVOICE_DUE_DAYS: ${LYTEX_INVOICE_DUE_DAYS:-7}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      LOG_TO_DB: ${LOG_TO_DB:-true}
    depends_on:
      - mongo

volumes:
  mongo_data:
