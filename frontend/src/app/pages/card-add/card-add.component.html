<div class="page-head page-head-row">
  <div>
    <a mat-button color="primary" routerLink="/cards" class="back">
      <mat-icon>arrow_back</mat-icon>
      Voltar aos cartões
    </a>
    <h1>Adicionar cartão</h1>
    <p class="lead">Tokenização Lytex vinculada ao seu usuário. Não armazenamos número completo nem CVC.</p>
  </div>
</div>

<mat-card class="form-card">
  <mat-card-header>
    <mat-card-title>Dados do cartão</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="form" class="grid" (ngSubmit)="submit()">
      <mat-form-field appearance="outline">
        <mat-label>CPF/CNPJ</mat-label>
        <input matInput formControlName="cpfCnpj" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="span2">
        <mat-label>Número</mat-label>
        <input matInput formControlName="number" autocomplete="cc-number" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Nome impresso</mat-label>
        <input matInput formControlName="holder" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Validade (MMYY)</mat-label>
        <input matInput formControlName="expiry" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>CVC</mat-label>
        <input matInput type="password" formControlName="cvc" autocomplete="cc-csc" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="span2">
        <mat-label>Apelido (opcional)</mat-label>
        <input matInput formControlName="label" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>E-mail</mat-label>
        <input matInput type="email" formControlName="email" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Celular</mat-label>
        <input matInput formControlName="cellphone" />
      </mat-form-field>
      <div class="actions">
        <button mat-stroked-button type="button" color="primary" routerLink="/cards">Cancelar</button>
        <button mat-flat-button color="primary" type="submit" [disabled]="saving() || form.invalid">
          @if (saving()) {
            <mat-spinner diameter="22"></mat-spinner>
          } @else {
            Salvar cartão
          }
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
